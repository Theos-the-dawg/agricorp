{% load static %}
<h1>Products in {{ category.name }}</h1>
<ul>
  {% for product in products %}
    <li>
      <a href="{% url 'product_detail' product.id %}">
        {{ product.name }} - R{{ product.price }}
      </a>
    </li>
  {% endfor %}
</ul>
<a href="{% url 'category_list' %}">Back to Categories</a>
